name: SonarQube analysis
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  analysis:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check SonarQube token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN" || { echo 'Add the SONAR_TOKEN repository secret before running CI analysis.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install --only-binary :all: "requests>=2.31,<3" "Pillow>=9.5,<13"
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm test
      - run: 'python -m pip install --only-binary :all: coverage==7.16.1'
      - run: python -m coverage run --source=desktop_app,flag_data,flag_legacy -m unittest discover -s tests -p 'test_*.py'
      - run: python -m coverage xml -o coverage-reports/python.xml
      - run: npm run test:browser
        env:
          SONAR_COVERAGE: '1'
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
