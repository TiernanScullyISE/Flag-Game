<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Revision — Flag & Capital Quiz</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="theme.js?v=theme-2"></script>
  <link rel="stylesheet" href="style.css?v=regional-map-9" />
</head>
<body data-revise-scope="countries">
  <header class="site-header with-nav">
    <a class="brand" href="index.html">Flag & Capital Quiz</a>
    <nav class="top-nav">
      <a class="nav-link" href="game.html">Play</a>
      <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      <a class="nav-link active" href="revise.html">Revision</a>
      <a class="nav-link" href="view.html">All</a>
      <a class="nav-link" href="feedback.html">Feedback</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-intro">
      <p class="section-kicker">Revision</p>
      <h1>Review saved countries, counties, states, capitals, and county towns.</h1>
    </section>

    <div class="segment-switch revise-scope-switch" aria-label="Revision set">
      <button class="segment revise-scope-segment active" data-revise-scope="countries">Countries</button>
      <button class="segment revise-scope-segment" data-revise-scope="regions">Regions</button>
    </div>

    <div class="segment-switch">
      <label class="segment-radio">
        <input type="radio" name="revise-mode" value="capitals" checked>
        <span>Capital Revise</span>
      </label>
      <label class="segment-radio">
        <input type="radio" name="revise-mode" value="flags">
        <span>Flag Revise</span>
      </label>
      <label class="segment-radio">
        <input type="radio" name="revise-mode" value="flashcards">
        <span>Capital Flashcards</span>
      </label>
    </div>

    <section class="toolbar">
      <div class="control country-revise-control">
        <label id="revise-continent-label" for="revise-continent">Continent</label>
        <select id="revise-continent"></select>
      </div>
      <div class="control region-revise-control">
        <label for="revise-region-set-input">Country</label>
        <input id="revise-region-set-input" type="search" list="revise-region-set-options" autocomplete="off" />
        <datalist id="revise-region-set-options"></datalist>
      </div>
    </section>

    <section id="revise-list" class="revise-list" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <p>Your revision items are stored in localStorage.</p>
  </footer>

  <script src="data.js?v=regional-map-9" defer></script>
  <script src="regions-generated-data.js?v=regional-map-9" defer></script>
  <script src="regions-data.js?v=regional-map-9" defer></script>
  <script src="utils.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3" defer></script>
  <script src="map-view.js?v=capital-map-18" defer></script>
  <script src="region-map.js?v=regional-map-9" defer></script>
  <script src="revise.js?v=regional-map-9" defer></script>
</body>
</html>
