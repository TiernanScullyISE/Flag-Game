<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Flag & Capital Quiz</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="theme.js?v=polish-1"></script>
  <link rel="stylesheet" href="style.css?v=polish-1" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header with-nav">
    <a class="brand" href="index.html">Flag & Capital Quiz</a>
    <nav class="top-nav" aria-label="Main navigation">
      <a class="nav-link" href="game.html">Play</a>
      <a class="nav-link" href="leaderboard.html">Leaderboard</a>
      <a class="nav-link" href="revise.html">Revision</a>
      <a class="nav-link" href="view.html">Browse</a>
      <a class="nav-link" href="feedback.html">Feedback</a>
    </nav>
  </header>

  <main id="main-content" tabindex="-1" class="container">
    <section class="page-intro">
      <p class="section-kicker">Admin</p>
      <h1>Review runs and learning progress.</h1>
    </section>

    <section class="toolbar admin-toolbar admin-login-toolbar">
      <div class="control">
        <label for="admin-password">Admin password</label>
        <input id="admin-password" type="password" autocomplete="current-password" />
      </div>
      <div class="control compact-control admin-remember-control">
        <label class="checkbox">
          <input id="admin-remember-password" type="checkbox" />
          <span>Trust this device</span>
        </label>
      </div>
      <button id="admin-load" class="btn primary" type="button">Unlock and load runs</button>
    </section>

    <section id="admin-tools" class="toolbar admin-toolbar admin-tools" hidden>
      <div class="control compact-control">
        <label for="admin-run-status-filter">Run status</label>
        <select id="admin-run-status-filter">
          <option value="pending">Pending</option>
          <option value="all">All</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="control compact-control">
        <label for="admin-run-age-filter">Created</label>
        <select id="admin-run-age-filter">
          <option value="24">Last 24 hours</option>
          <option value="168">Last 7 days</option>
          <option value="720">Last 30 days</option>
          <option value="all">Any time</option>
        </select>
      </div>
      <div class="control admin-run-search-control">
        <label for="admin-run-search">Find run, name, device or mode</label>
        <input id="admin-run-search" type="search" autocomplete="off" placeholder="Search loaded runs" />
      </div>
      <label class="checkbox admin-duplicate-filter-control">
        <input id="admin-run-duplicates-only" type="checkbox" />
        <span>Duplicate evidence only</span>
      </label>
      <button id="admin-refresh" class="btn subtle" type="button">Refresh runs</button>
      <label class="checkbox admin-select-visible-control">
        <input id="admin-select-visible" type="checkbox" />
        <span>Select visible</span>
      </label>
      <button id="admin-bulk-reject" class="btn danger" type="button" disabled>Reject selected</button>
      <button id="admin-analytics" class="btn subtle" type="button">Load analytics</button>
      <button id="admin-feedback" class="btn subtle" type="button">Load feedback</button>
      <div class="control compact-control">
        <label for="admin-export-scope">CSV export</label>
        <select id="admin-export-scope">
          <option value="all">All data</option>
          <option value="filter">Specific device/player(s)</option>
        </select>
      </div>
      <div class="control admin-export-filter-control">
        <label for="admin-export-filter">Device/player filter</label>
        <input id="admin-export-filter" type="search" autocomplete="off" placeholder="Comma-separated names or devices" />
      </div>
      <button id="admin-export" class="btn subtle" type="button">Export CSV</button>
    </section>

    <section id="admin-status" class="leaderboard-page-status" aria-live="polite"></section>
    <section id="admin-list" class="admin-list" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <p>Approved runs appear on the public leaderboard. Private analytics stay admin-only.</p>
  </footer>

  <script src="leaderboard-config.js" defer></script>
  <script src="analytics.js?v=regional-leaderboard-1" defer></script>
  <script src="ui.js?v=polish-1" defer></script>
  <script src="admin.js?v=timing-review-1" defer></script>
</body>
</html>
